name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Extension checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (advisory)
        id: dependency-audit
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Report dependency audit failure
        if: steps.dependency-audit.outcome == 'failure'
        run: echo "::warning::Dependency audit reported high or critical vulnerabilities or could not complete. See the audit step for details."

      - name: Lint (advisory)
        id: lint
        # Remove this once the existing ESLint violations are fixed.
        continue-on-error: true
        run: pnpm run lint

      - name: Report lint findings
        if: steps.lint.outcome == 'failure'
        run: echo "::warning::ESLint failed. See the Lint (advisory) step for details."

      - name: Type check
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build the Chrome extension
        run: pnpm run build
